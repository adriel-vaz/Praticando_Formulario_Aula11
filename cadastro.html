<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Dead Redemption 2 - Alistamento na Gangue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #f4f4f4; }
        .card { background-color: #1e1e1e; color: #fff; border: 1px solid #dc3545; }
        .form-label { color: #ffc107; font-weight: bold; }
        .navbar { background-color: #000; border-bottom: 2px solid #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold fs-3" href="index.html">RDR2 - BANDO</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Início</a>
                <a class="nav-link" href="equipamentos.html">Arsenais & Cavalos</a>
                <a class="nav-link active" href="cadastro.html">Alistamento</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card p-4 shadow-lg">
            <h2 class="text-danger text-center mb-2">Ficha de Registro de Fora-da-Lei</h2>
            <p class="text-center text-muted mb-4">Preencha os seus dados para solicitar o ingresso na gangue Van der Linde.</p>

            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome ou Codinome:</label>
                        <input type="text" class="form-control" id="nome" placeholder="Ex: Arthur Morgan" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Correio Eletrónico:</label>
                        <input type="email" class="form-control" id="email" placeholder="arthur@vanderlinde.com" required>
                    </div>
                    <div class="col-md-4">
                        <label for="telefone" class="form-label">Contacto (Telégrafo):</label>
                        <input type="tel" class="form-control" id="telefone" placeholder="(17) 99999-9999">
                    </div>
                    <div class="col-md-4">
                        <label for="url" class="form-label">Link do Perfil / Cartaz:</label>
                        <input type="url" class="form-control" id="url" placeholder="https://socialclub.rockstargames.com/...">
                    </div>
                    <div class="col-md-4">
                        <label for="recompensa" class="form-label">Recompensa pela sua cabeça ($):</label>
                        <input type="number" class="form-control" id="recompensa" placeholder="5000" min="0">
                    </div>
                    <div class="col-md-6">
                        <label for="data" class="form-label">Data de Entrada Pretendida:</label>
                        <input type="date" class="form-control" id="data">
                    </div>
                    <div class="col-md-6">
                        <label for="foto" class="form-label">Anexar Fotografia / Retrato:</label>
                        <input type="file" class="form-control" id="foto">
                    </div>
                    <div class="col-md-12">
                        <label for="regiao" class="form-label">Região Principal de Atuação:</label>
                        <select class="form-select" id="regiao">
                            <option selected disabled>Selecione um estado do mapa...</option>
                            <option value="new_hanover">New Hanover (Valentine / Emerald Ranch)</option>
                            <option value="lemoyne">Lemoyne (Rhodes / Saint Denis)</option>
                            <option value="ambarino">Ambarino (Grizzlies)</option>
                            <option value="west_elizabeth">West Elizabeth (Blackwater / Strawberry)</option>
                            <option value="new_austin">New Austin (Armadillo / Tumbleweed)</option>
                        </select>
                    </div>
                    <div class="col-md-12 my-3">
                        <label class="form-label d-block">Especialidade Principal no Bando:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="funcao" id="atirador" value="atirador">
                            <label class="form-check-label" for="atirador">Atirador</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="funcao" id="cacador" value="cacador">
                            <label class="form-check-label" for="cacador">Caçador</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="funcao" id="estrategista" value="estrategista">
                            <label class="form-check-label" for="estrategista">Estrategista</label>
                        </div>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label d-block">Habilidades Especiais Domínio:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="dead_eye" value="dead_eye">
                            <label class="form-check-label" for="dead_eye">Olho Morto (Dead Eye)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="equitacao" value="equitacao">
                            <label class="form-check-label" for="equitacao">Excelente Equitação</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="luta" value="luta">
                            <label class="form-check-label" for="luta">Luta Corporal</label>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label for="biografia" class="form-label">Histórico Criminal / Biografia:</label>
                        <textarea class="form-control" id="biografia" rows="4" placeholder="Descreva os seus últimos assaltos e motivos para se juntar ao bando..."></textarea>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-danger px-5 me-2 fw-bold">Enviar Registo</button>
                        <button type="reset" class="btn btn-secondary px-4">Limpar Ficha</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
